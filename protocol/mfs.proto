syntax = "proto3";

package mfs.icd.v3;

enum ComponentId {
  COMPONENT_ID_UNSPECIFIED = 0;
  // Surveillance Asset is the operational term; the v1/v2 wire identifier is
  // retained to avoid a name-only compatibility break.
  COMPONENT_ID_OBSERVATION_ASSET = 1;
  COMPONENT_ID_COMMAND_AND_CONTROL = 2;
  COMPONENT_ID_EFFECTOR_ASSET = 3;
}

enum CoordinateFrame {
  COORDINATE_FRAME_UNSPECIFIED = 0;
  COORDINATE_FRAME_PROJECT = 1;
}

enum ObservationTurretCommandType {
  OBSERVATION_TURRET_COMMAND_TYPE_UNSPECIFIED = 0;
  OBSERVATION_TURRET_COMMAND_TYPE_HOME = 1;
  OBSERVATION_TURRET_COMMAND_TYPE_STOP = 2;
  OBSERVATION_TURRET_COMMAND_TYPE_ABSOLUTE_ANGLE = 3;
  OBSERVATION_TURRET_COMMAND_TYPE_SCAN = 4;
}

enum ObservationState {
  OBSERVATION_STATE_UNSPECIFIED = 0;
  OBSERVATION_STATE_OFF = 1;
  OBSERVATION_STATE_INITIALIZING = 2;
  OBSERVATION_STATE_STANDBY = 3;
  OBSERVATION_STATE_OPERATING = 4;
  OBSERVATION_STATE_FAULT = 5;
}

enum EffectorState {
  EFFECTOR_STATE_UNSPECIFIED = 0;
  EFFECTOR_STATE_OFF = 1;
  EFFECTOR_STATE_INITIALIZING = 2;
  EFFECTOR_STATE_STANDBY = 3;
  EFFECTOR_STATE_SLEWING = 4;
  EFFECTOR_STATE_READY = 5;
  EFFECTOR_STATE_ACTIVE = 6;
  EFFECTOR_STATE_FAULT = 7;
}

enum AttackAction {
  ATTACK_ACTION_UNSPECIFIED = 0;
  ATTACK_ACTION_ARM = 1;
  ATTACK_ACTION_START = 2;
  ATTACK_ACTION_STOP = 3;
  ATTACK_ACTION_EMERGENCY_STOP = 4;
}

enum CommandResult {
  COMMAND_RESULT_UNSPECIFIED = 0;
  COMMAND_RESULT_RECEIVED = 1;
  COMMAND_RESULT_ACCEPTED = 2;
  COMMAND_RESULT_IN_PROGRESS = 3;
  COMMAND_RESULT_COMPLETED = 4;
  COMMAND_RESULT_REJECTED = 5;
  COMMAND_RESULT_FAILED = 6;
}

enum AssetOperatingState {
  ASSET_OPERATING_STATE_UNSPECIFIED = 0;
  ASSET_OPERATING_STATE_OFF = 1;
  ASSET_OPERATING_STATE_INITIALIZING = 2;
  ASSET_OPERATING_STATE_STANDBY = 3;
  ASSET_OPERATING_STATE_OPERATING = 4;
  ASSET_OPERATING_STATE_SLEWING = 5;
  ASSET_OPERATING_STATE_READY = 6;
  ASSET_OPERATING_STATE_ACTIVE = 7;
  ASSET_OPERATING_STATE_FAULT = 8;
}

enum ErrorSeverity {
  ERROR_SEVERITY_UNSPECIFIED = 0;
  ERROR_SEVERITY_INFO = 1;
  ERROR_SEVERITY_WARNING = 2;
  ERROR_SEVERITY_ERROR = 3;
  ERROR_SEVERITY_CRITICAL = 4;
}

enum AssetRole {
  ASSET_ROLE_UNSPECIFIED = 0;
  ASSET_ROLE_OBSERVATION = 1;
  ASSET_ROLE_EFFECTOR = 2;
}

enum TrackingStopReason {
  TRACKING_STOP_REASON_NONE = 0;
  TRACKING_STOP_REASON_OPERATOR_STOP = 1;
  TRACKING_STOP_REASON_EMERGENCY_STOP = 2;
  TRACKING_STOP_REASON_TARGET_EXPIRED = 3;
  TRACKING_STOP_REASON_PREDICTION_TIMEOUT = 4;
  TRACKING_STOP_REASON_OUTSIDE_TURRET_LIMITS = 5;
  TRACKING_STOP_REASON_POSE_UNAVAILABLE = 6;
  TRACKING_STOP_REASON_INVALID_TARGET = 7;
  TRACKING_STOP_REASON_TRACK_MISMATCH = 8;
  TRACKING_STOP_REASON_TARGET_LOST = 9;
  TRACKING_STOP_REASON_ACTUATOR_FAULT = 10;
  TRACKING_STOP_REASON_COMMUNICATION_TIMEOUT = 11;
  TRACKING_STOP_REASON_FOLLOWING_ERROR = 12;
  TRACKING_STOP_REASON_SESSION_REPLACED = 13;
}

message MessageHeader {
  uint32 protocol_version = 1;
  uint32 sequence = 2;
  uint64 timestamp_us = 3;
  ComponentId source_id = 4;
  ComponentId destination_id = 5;
  uint64 asset_id = 6;
  uint64 session_id = 7;
}

message PanTiltLimits {
  float minimum_pan_deg = 1;
  float maximum_pan_deg = 2;
  float minimum_tilt_deg = 3;
  float maximum_tilt_deg = 4;
}

// Both assets publish their installation pose in the common PROJECT_FRAME.
// Azimuth is measured from +X toward +Y and normalized to [0, 360) degrees.
message AssetPose {
  MessageHeader header = 1;
  CoordinateFrame coordinate_frame = 2;
  float x_m = 3;
  float y_m = 4;
  float z_m = 5;
  float azimuth_deg = 6;
}

// The observation asset converts sensor-local results into PROJECT_FRAME world
// coordinates before transmission. C2 must not apply this conversion again.
message TargetCoordinate {
  MessageHeader header = 1;
  uint32 detection_id = 2;
  uint64 measurement_time_us = 3;
  CoordinateFrame coordinate_frame = 4;
  float x_m = 5;
  float y_m = 6;
  float z_m = 7;
  float confidence = 8;
  float vx_mps = 9;
  float vy_mps = 10;
  float vz_mps = 11;
  // Explicit validity distinguishes a measured stationary target from an
  // unavailable velocity. Position and velocity share measurement_time_us.
  bool velocity_valid = 12;
}

// Validated global track state from C2 to the assigned effector.  Stream
// freshness is enforced by sequence, timestamps, destination asset/session,
// source endpoint, and valid_until_us; this message is not command-ACKed.
message TargetTrackUpdate {
  MessageHeader header = 1;
  uint64 track_id = 2;
  CoordinateFrame coordinate_frame = 3;
  float x_m = 4;
  float y_m = 5;
  float z_m = 6;
  float vx_mps = 7;
  float vy_mps = 8;
  float vz_mps = 9;
  bool velocity_valid = 10;
  uint64 measurement_time_us = 11;
  uint64 valid_until_us = 12;
  float confidence = 13;
  uint64 observation_asset_id = 14;
  uint64 observation_session_id = 15;
}

// Scanning is derived from state == OPERATING and lidar_active. turret_active
// only indicates whether a Pan/Tilt axis is moving at the status timestamp.
message ObservationStatus {
  MessageHeader header = 1;
  ObservationState state = 2;
  float current_pan_deg = 3;
  float current_tilt_deg = 4;
  bool lidar_active = 5;
  bool turret_active = 6;
  uint32 error_code = 7;
  uint64 timestamp_us = 8;
}

// HOME returns to the reference position, STOP halts motion and search,
// ABSOLUTE_ANGLE points without starting search, and SCAN points to the
// requested center angle before starting the configured search pattern.
message ObservationTurretCommand {
  MessageHeader header = 1;
  uint32 command_id = 2;
  ObservationTurretCommandType command_type = 3;
  float target_pan_deg = 4;
  float target_tilt_deg = 5;
  uint64 valid_until_us = 6;
}

message EffectorTurretCommand {
  // Manual absolute-angle, diagnostic, and legacy compatibility path only.
  // Automatic tracking uses TargetTrackUpdate and effector-local pointing.
  MessageHeader header = 1;
  uint32 command_id = 2;
  uint64 target_id = 3;
  float target_pan_deg = 4;
  float target_tilt_deg = 5;
  uint64 valid_until_us = 6;
}

message AttackCommand {
  MessageHeader header = 1;
  uint32 command_id = 2;
  uint64 target_id = 3;
  AttackAction action = 4;
  // START attack-output duration only. It does not bound automatic tracking,
  // which continues until STOP/ESTOP or an unsafe/untrackable condition.
  uint32 duration_ms = 5;
  uint64 valid_until_us = 6;
}

message EffectorStatus {
  MessageHeader header = 1;
  EffectorState state = 2;
  float current_pan_deg = 3;
  float current_tilt_deg = 4;
  float target_pan_deg = 5;
  float target_tilt_deg = 6;
  bool aligned = 7;
  bool attack_armed = 8;
  bool attack_active = 9;
  uint32 error_code = 10;
  uint64 timestamp_us = 11;
  uint64 tracking_track_id = 12;
  bool automatic_tracking_active = 13;
  uint64 last_target_measurement_time_us = 14;
  uint64 target_freshness_us = 15;
  TrackingStopReason tracking_stop_reason = 16;
  float predicted_x_m = 17;
  float predicted_y_m = 18;
  float predicted_z_m = 19;
}

message CommandAck {
  MessageHeader header = 1;
  uint32 command_id = 2;
  CommandResult result = 3;
  uint32 error_code = 4;
  uint64 timestamp_us = 5;
}

message Heartbeat {
  MessageHeader header = 1;
  AssetOperatingState state = 2;
  uint64 uptime_ms = 3;
  uint64 timestamp_us = 4;
}

message ErrorReport {
  MessageHeader header = 1;
  uint32 error_code = 2;
  ErrorSeverity severity = 3;
  uint32 related_command_id = 4;
  uint64 timestamp_us = 5;
  string detail = 6;
}

message AssetRegistration {
  MessageHeader header = 1;
  AssetRole role = 2;
  uint32 command_port = 3;
  uint64 capabilities = 4;
  string software_version = 5;
  string hardware_version = 6;
  PanTiltLimits turret_limits = 7;
  bool concurrent_tasks = 8;
  uint64 lease_duration_ms = 9;
}

message AssetUnregister {
  MessageHeader header = 1;
  string reason = 2;
}

message Envelope {
  oneof payload {
    AssetPose asset_pose = 1;
    TargetCoordinate target_coordinate = 2;
    ObservationStatus observation_status = 3;
    ObservationTurretCommand observation_turret_command = 4;
    EffectorTurretCommand effector_turret_command = 5;
    AttackCommand attack_command = 6;
    EffectorStatus effector_status = 7;
    CommandAck command_ack = 8;
    Heartbeat heartbeat = 9;
    ErrorReport error_report = 10;
    AssetRegistration asset_registration = 11;
    AssetUnregister asset_unregister = 12;
    TargetTrackUpdate target_track_update = 13;
  }
}
